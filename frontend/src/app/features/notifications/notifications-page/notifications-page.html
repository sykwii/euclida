<section class="eu-n-page">
  <div class="eu-n-console">
    <header class="eu-n-header">
      <div>
        <span>Євкліда · Оперативні повідомлення</span>
        <h1>Центр повідомлень</h1>
      </div>

      <div class="eu-n-header-actions">
        <button type="button" class="eu-n-refresh" (click)="load()" [disabled]="isLoading">
          {{ isLoading ? 'Оновлення' : 'Оновити' }}
        </button>
        <button type="button" class="eu-n-refresh" (click)="readAll()">
          Позначити всі прочитаними
        </button>
      </div>
    </header>

    <nav class="eu-n-tabs" aria-label="Категорії повідомлень">
      <button type="button" [class.active]="activeTab === 'new'" (click)="setTab('new')">
        <span>Нові</span>
        <b>{{ newCount }}</b>
      </button>
      <button type="button" class="tone-danger" [class.active]="activeTab === 'critical'" (click)="setTab('critical')">
        <span>Критичні</span>
        <b>{{ criticalCount }}</b>
      </button>
      <button type="button" class="tone-journal" [class.active]="activeTab === 'history'" (click)="setTab('history')">
        <span>Історія</span>
        <b>{{ items.length }}</b>
      </button>
    </nav>

    <nav class="eu-n-filters" aria-label="Фільтри повідомлень">
      <button type="button" [class.active]="activeFilter === 'all'" (click)="setFilter('all')">Усі</button>
      <button type="button" [class.active]="activeFilter === 'targets'" (click)="setFilter('targets')">Цілі</button>
      <button type="button" [class.active]="activeFilter === 'weapons'" (click)="setFilter('weapons')">СГ</button>
      <button type="button" [class.active]="activeFilter === 'fire_positions'" (click)="setFilter('fire_positions')">ВП</button>
    </nav>

    <div class="eu-n-state error" *ngIf="errorMessage && !isLoading">
      <strong>{{ errorMessage }}</strong>
      <button type="button" (click)="load()">Повторити</button>
    </div>

    <div class="eu-n-loading" *ngIf="isLoading" aria-label="Завантаження повідомлень">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <main class="eu-n-workspace" *ngIf="!isLoading">
      <section class="eu-n-list">
        <div class="eu-n-empty" *ngIf="visibleItems.length === 0">
          <strong>Оперативних повідомлень немає</strong>
          <span>Технічні оновлення карти, складу й аналітики тут не показуються.</span>
        </div>

        <section class="eu-n-day" *ngFor="let group of groupedItems; trackBy: trackGroup">
          <h2>{{ group.title }}</h2>

          <article
            class="eu-n-row"
            *ngFor="let item of group.items; trackBy: trackById"
            [class.unread]="!item.readAt"
            [ngClass]="'severity-' + item.severity"
            tabindex="0"
            role="button"
            (click)="open(item)"
            (keydown.enter)="open(item)"
            (keydown.space)="open(item); $event.preventDefault()"
          >
            <i aria-hidden="true"></i>
            <span class="unread-dot" *ngIf="!item.readAt" aria-hidden="true"></span>
            <div>
              <strong>{{ titleLine(item) }}</strong>
              <small>{{ contextLine(item) }}</small>
            </div>
            <em>{{ getTypeLabel(item) }}</em>
            <time>{{ item.createdAt | date: 'HH:mm' }}</time>
            <span class="row-actions">
              <button type="button" title="Прочитати" aria-label="Прочитати" (click)="read(item, $event)"></button>
              <button type="button" title="Підтвердити" aria-label="Підтвердити" (click)="acknowledge(item, $event)"></button>
            </span>
          </article>
        </section>
      </section>
    </main>
  </div>
</section>
